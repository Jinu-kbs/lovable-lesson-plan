<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교안 검색 — 김선생의 바이브코딩 가이드</title>
<meta name="description" content="김선생의 바이브코딩 가이드 전체 교안을 검색하세요.">
<link rel="stylesheet" href="common.css">
<style>
:root{--primary:#5A4ED9;--primary-light:#C5BFFB;--blockquote-bg:#F0F0FF;--hover-bg:#FAFAFF}
.search-wrap{max-width:760px;margin:0 auto;padding:40px 20px 60px}
.search-wrap h1{font-size:1.5rem;font-weight:800;margin:0 0 6px;color:var(--text)}
.search-wrap .sub{color:var(--text-light);font-size:.9rem;margin-bottom:22px}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card-bg);border:1px solid var(--border);border-radius:30px;padding:10px 10px 10px 18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.search-box .mag{opacity:.55;font-size:1.05rem}
.search-box input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:1rem;color:var(--text);font-family:inherit}
.search-box input::placeholder{color:var(--text-light)}
.search-box button{border:none;background:var(--primary);color:#FFF;border-radius:22px;padding:9px 18px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
.search-count{margin:22px 2px 12px;color:var(--text-light);font-size:.85rem;font-weight:600}
.search-hint{color:var(--text-light);font-size:.92rem;padding:20px 4px;line-height:1.7}
.search-result{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;text-decoration:none;transition:all .15s;background:var(--card-bg)}
.search-result:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.sr-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.sr-body{display:flex;flex-direction:column;min-width:0;flex:1}
.sr-title{font-weight:700;font-size:1rem;color:var(--text)}
.sr-desc{font-size:.85rem;color:var(--text-light);margin-top:2px}
.sr-snippet{font-size:.82rem;color:var(--text-light);margin-top:5px;line-height:1.5;background:var(--code-bg);border-radius:6px;padding:6px 9px}
.search-result mark, .hero-search-suggest mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px;font-weight:700}
.sr-badge{font-size:.75rem;color:var(--primary);font-weight:600;margin-top:4px}
.sr-arrow{color:var(--text-light);font-size:1.2rem;flex-shrink:0}
.sp-chip{display:inline-block;background:var(--blockquote-bg);color:var(--primary);border:none;border-radius:14px;padding:5px 14px;font-size:.85rem;font-weight:600;cursor:pointer;margin:3px;font-family:inherit}
.sp-chip:hover{background:var(--primary);color:#FFF}
.search-hint a{color:var(--primary);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html" class="brand">🎓 바이브코딩 가이드</a>
  <a href="index.html">홈</a>
  <a href="index.html#all-cards">전체 교안</a>
</nav>

<main class="search-wrap">
  <h1>🔍 교안 검색</h1>
  <p class="sub">도구 이름(러버블·커서·Claude Code…), 주제(터미널·배포·프롬프트…), 수준으로 검색하세요.</p>

  <form class="search-box" id="searchPageForm" role="search" autocomplete="off">
    <span class="mag" aria-hidden="true">🔍</span>
    <input type="text" id="searchPageInput" placeholder="검색어를 입력하세요" aria-label="교안 검색">
    <button type="submit">검색</button>
  </form>

  <div class="search-count" id="searchCount"></div>
  <div id="searchResults"></div>
</main>

<footer>
  본 페이지는 김선생의 바이브코딩 가이드 전체 교안을 검색합니다. · <a href="index.html">홈으로</a>
</footer>

<script src="lessons-data.js"></script>
<script src="search.js"></script>
</body>
</html>
